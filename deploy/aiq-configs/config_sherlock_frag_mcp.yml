# Sherlock forensic co-investigator — AI-Q config (Phase 7)
#
# Extends config_web_frag.yml with:
#   - Web search DISABLED (air-gapped forensic deployment)
#   - sherlock-tools MCP: graph_query, graph_analyze, extract_entities, list_cases
#   - vss-agent MCP: video search and summarization (enabled when GPU ready)
#   - Knowledge layer: RAG-BP FRAG (case text, transcripts, lab reports)
#
# Active config: set BACKEND_CONFIG=/app/configs/config_sherlock_frag.yml
# and restart amms-aiq-agent.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
    # ── Track 2a / Phase 9a — Phoenix on-prem tracing ────────────────────────
    # Gives the full agent trace tree with ZERO code changes: a <workflow> root
    # span, one LLM span per model call (with prompt/completion/total token counts
    # and latency), and one span per tool call (graph_query, knowledge_search,
    # ask_video, analyze_audio...). AI-Q's Dask job runner builds the exporter
    # from exactly this block (aiq_api/jobs/runner.py).
    #
    # endpoint MUST end in /v1/traces — the exporter passes the URL through
    # verbatim and never appends a path. Get this wrong and the agent still works
    # perfectly while every export fails with a single
    #   "Failed to export span batch code: 405, Method Not Allowed"
    # line and Phoenix stays empty. This exporter is OTLP-over-HTTP only; the
    # gRPC port (4317) is not supported.
    #
    # Use the explicit host `amms-phoenix` (deploy/compose.phoenix.yaml).
    # NOT `localhost` (that is the agent container itself) and NOT bare `phoenix`
    # (resolves to corporate DNS 10.31.52.19 when no local alias claims it).
    # Set PHOENIX_TRACING_ENDPOINT="" to disable tracing without editing this file.
    tracing:
      phoenix:
        _type: phoenix
        endpoint: ${PHOENIX_TRACING_ENDPOINT:-http://amms-phoenix:6006/v1/traces}
        project: ${PHOENIX_PROJECT:-sherlock}

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods: [GET, POST, DELETE, OPTIONS]
      allow_headers: ["*"]
      allow_credentials: true
      expose_headers: ["*"]

llms:
  nemotron_llm_intent:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  nemotron_nano_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  # Fast variant — thinking disabled, lower max_tokens. Used by deep_research_agent
  # orchestrator/planner to avoid stacking 10+ thinking-mode LLM calls.
  nemotron_fast_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.1
    top_p: 0.3
    max_tokens: 8192
    num_retries: 3

  gpt_oss_llm:
    _type: nim
    model_name: openai/gpt-oss-120b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 1.0
    top_p: 1.0
    max_tokens: 256000
    api_key: ${NVIDIA_API_KEY}
    max_retries: 10

# ── MCP function groups ──────────────────────────────────────────────────────

function_groups:
  # Sherlock graph tools (graph_query, graph_analyze, extract_entities, list_cases)
  mcp_sherlock_tools:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${SHERLOCK_MCP_URL:-http://sherlock-mcp:9901/mcp}
    tool_call_timeout: 300   # analyze_audio (MERaLiON ~2 min first call) needs more than 60s default
    tool_overrides:
      graph_query_tool:
        description: >
          Query the forensic entity graph for suspects, witnesses, organizations,
          locations, and evidence items in a Singapore Police Force case.
          Use before graph_analyze_tool to see what entities exist.
      graph_analyze_tool:
        description: >
          Run centrality or community-detection algorithms to identify the most
          connected actors or networks in a forensic case graph.
      extract_entities_tool:
        description: >
          Extract and index entities from new evidence text (reports, transcripts,
          chat logs) into the case graph. Call this when new evidence is submitted.
      list_cases:
        description: >
          List all forensic case IDs available in the graph database.
          Use to discover cases before querying a specific one.

  # VSS video specialist — custom MCP wrapping vss-agent + vss-lvs (LVS profile)
  # Tools: list_case_videos, ask_video, summarize_video
  # Started by phase7_extensions.sh; requires vss-agent (:8000) + vss-lvs (:38111)
  mcp_vss_agent:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${VSS_MCP_URL:-http://vss-sherlock-mcp:9903/mcp}
    tool_call_timeout: 300   # video analysis (rtvi-vlm + vss-agent) can take 30-90s; default 60s is too short

functions:
  # ── Data source registry ───────────────────────────────────────────────────
  data_sources:
    _type: data_source_registry
    sources:
      - id: knowledge_layer
        name: "Case Documents"
        description: "Search ingested case files — reports, witness statements, lab reports, transcripts."
        tools:
          - knowledge_search
      - id: graph_tools
        name: "Case Graph"
        description: "Query and analyze the forensic entity graph — suspects, relations, networks."
        tools:
          - mcp_sherlock_tools
      - id: video_tools
        name: "Video Evidence"
        description: "Analyse and summarise video evidence via VSS LVS. Use for forensic video Q&A and long-recording summaries."
        tools:
          - mcp_vss_agent

  # Knowledge retrieval via RAG-BP FRAG
  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-multimodal_data}
    top_k: 5
    rag_url: ${RAG_SERVER_URL:-http://localhost:8081}
    ingest_url: ${RAG_INGEST_URL:-http://localhost:8082}
    timeout: 300

  # ── Agents ─────────────────────────────────────────────────────────────────
  intent_classifier:
    _type: intent_classifier
    llm: nemotron_llm_intent

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_nano_llm
    planner_llm: nemotron_nano_llm
    max_turns: 3
    enable_plan_approval: false   # disabled: workbench handles HITL via detectPlan()
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_nano_llm
    max_llm_turns: 10
    max_tool_iterations: 8

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: nemotron_fast_llm   # no thinking tokens — 3-5x faster per call
    researcher_llm: nemotron_nano_llm
    planner_llm: nemotron_fast_llm        # no thinking tokens
    max_loops: 1

workflow:
  _type: shallow_research_workflow
