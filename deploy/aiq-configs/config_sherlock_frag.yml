# Sherlock forensic co-investigator — AI-Q config (BASE — no MCP)
#
# This is the MCP-FREE base loaded by Phases 1-6 and materialized by phase1_aiq.sh.
# It deliberately has NO mcp_client: the Sherlock MCP server isn't running yet at
# Phase 1, and mcp_client connects AT STARTUP — including it here crash-loops AI-Q
# ("[Errno -3] Temporary failure in name resolution" -> "Application startup failed").
#
# The MCP graph tools ("Case Graph") live in config_sherlock_frag_mcp.yml, swapped
# in at Phase 7 (phase7_extensions.sh) and materialized by start_all.sh — both bring
# the MCP server up BEFORE AI-Q.
#
#   - Web search DISABLED (air-gapped forensic deployment)
#   - Knowledge layer: RAG-BP FRAG (case text, transcripts, lab reports)

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
    # ── Track 2a / Phase 9a — Phoenix on-prem tracing ────────────────────────
    # Kept identical to config_sherlock_frag_mcp.yml so Phases 1-6 trace too.
    # Full rationale + gotchas: deploy/PHASE9A_OBSERVABILITY.md.
    # endpoint MUST end in /v1/traces (otherwise: silent 405, no traces).
    # Host must be `amms-phoenix` — not localhost, not bare `phoenix`.
    tracing:
      phoenix:
        _type: phoenix
        endpoint: ${PHOENIX_TRACING_ENDPOINT:-http://amms-phoenix:6006/v1/traces}
        project: ${PHOENIX_PROJECT:-sherlock}

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods: [GET, POST, DELETE, OPTIONS]
      allow_headers: ["*"]
      allow_credentials: true
      expose_headers: ["*"]

llms:
  nemotron_llm_intent:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  nemotron_nano_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  # Fast variant — thinking disabled, lower max_tokens. Used by deep_research_agent
  # orchestrator/planner to avoid stacking 10+ thinking-mode LLM calls.
  nemotron_fast_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.1
    top_p: 0.3
    max_tokens: 8192
    num_retries: 3

  gpt_oss_llm:
    _type: nim
    model_name: openai/gpt-oss-120b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 1.0
    top_p: 1.0
    max_tokens: 256000
    api_key: ${NVIDIA_API_KEY}
    max_retries: 10

# NOTE: function_groups (mcp_sherlock_tools + the commented mcp_vss_agent) are NOT
# here on purpose — this base config is loaded in Phases 1-6 before the MCP server
# exists. They live in config_sherlock_frag_mcp.yml (Phase 7 / start_all).

functions:
  # ── Data source registry ───────────────────────────────────────────────────
  data_sources:
    _type: data_source_registry
    sources:
      - id: knowledge_layer
        name: "Case Documents"
        description: "Search ingested case files — reports, witness statements, lab reports, transcripts."
        tools:
          - knowledge_search
      # "Case Graph" (graph_tools -> mcp_sherlock_tools) is added in
      # config_sherlock_frag_mcp.yml (Phase 7), NOT here — mcp_client connects at
      # startup and would crash-loop AI-Q in Phases 1-6 while the MCP server is down.
      # Uncomment when GPU instance ready:
      # - id: video_tools
      #   name: "Video Evidence"
      #   description: "Search and summarize video evidence via VSS."
      #   tools:
      #     - mcp_vss_agent

  # Knowledge retrieval via RAG-BP FRAG
  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-multimodal_data}
    top_k: 5
    rag_url: ${RAG_SERVER_URL:-http://localhost:8081}
    ingest_url: ${RAG_INGEST_URL:-http://localhost:8082}
    timeout: 300

  # ── Agents ─────────────────────────────────────────────────────────────────
  intent_classifier:
    _type: intent_classifier
    llm: nemotron_llm_intent

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_nano_llm
    planner_llm: nemotron_nano_llm
    max_turns: 3
    enable_plan_approval: false   # disabled: workbench handles HITL via detectPlan()
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_nano_llm
    max_llm_turns: 10
    max_tool_iterations: 8

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: nemotron_fast_llm   # no thinking tokens — 3-5x faster per call
    researcher_llm: nemotron_nano_llm
    planner_llm: nemotron_fast_llm        # no thinking tokens
    max_loops: 1

workflow:
  _type: shallow_research_workflow
