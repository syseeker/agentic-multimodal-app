# Sherlock inference benchmark — RTX PRO 6000 Blackwell
#
# Schema borrowed from inference-pipeline-benchmark's GPU YAMLs, trimmed to what Sherlock
# actually has: three local targets, one card, and no multi-backend sweep (there is nothing
# to sweep — the VLM is served by vLLM inside rtvi-vlm and we do not control its engine).
#
# Phase 9 MEASURES ONLY. Every service here is deployed by Phases 1-8; `bench` refuses to
# run when one is down rather than starting it.
#
# Blocks:
#   gpu:          facts about the card, used for VRAM preflight and headroom maths
#   targets:      what we can drive (replaces `models:` + `backends:` — for us they are 1:1)
#   workloads:    named payloads, generated by build_workloads.py from data/cases/
#   sweeps:       named ordered lists of runs
#   colocations:  contention windows — the point of the exercise
#
# Everything here is read by `bench`; nothing is hardcoded in the shell scripts.

gpu:
  display_name: "RTX PRO 6000 Blackwell Server Edition"
  arch: blackwell
  # Used by `bench` to auto-select this profile: platform must equal `uname -m`, and any
  # `match` substring must appear in `nvidia-smi --query-gpu=name`. Drop in a new yaml and
  # it registers itself; no code change.
  platform: x86_64
  match: ["rtx pro 6000"]
  vram_gb: 96
  mem_type: GDDR7
  # Memory is DISCRETE here. On GB10 it is 128 GB unified (VRAM + RAM share one budget),
  # so headroom maths does not transfer — write a separate gb10.yaml, do not copy this.
  unified_memory: false
  mps: true                 # required for colocation; without it tenants time-slice
  power_cap_w: 600          # for J/req sanity-checking against the sampler

# ── Targets ──────────────────────────────────────────────────────────────────
# `serving` is documentation AND behaviour: only openai_chat targets can be driven by
# aiperf. Anything else needs its own driver and is marked so.
targets:

  vlm:
    description: "Cosmos VLM for video Q&A / dense captioning"
    serving: openai_chat
    engine: vllm                      # in-process inside vss-rtvi-vlm, behind FastAPI
    container: vss-rtvi-vlm
    base_url: "http://localhost:8018"
    deployed_by: "deploy/phase5_vss.sh + deploy/patch_vss_rtvi_vlm.sh"
    # Model id is DISCOVERED from /v1/models at run time, never pinned here:
    # phase5_vss.sh deploys cosmos-reason1-7b while vss_sherlock_mcp.py asks for the
    # cosmos-reason2-8b NIM name. The server is the only authority.
    model: null
    model_from: "/v1/models"
    # aiperf resolves its tokenizer from --model unless told otherwise, but the served id is
    # an NGC NIM artifact name (nim_<org>_<model>_<tag>), not a HF repo -> 401 -> aiperf exits
    # before issuing a request and the window silently records n_requests=0.
    # --use-server-token-count does NOT avoid this in aiperf 0.11: it still resolves one.
    tokenizer: "nvidia/Cosmos-Reason2-8B"   # HF repo the served weights come from
    weights_gb: null                  # disputed (~46 vs ~62); B4/B6 measures it
    health: "/v1/health/ready"
    # Refuse to benchmark when rtvi-vlm is proxying: it would measure the remote endpoint.
    require_env:
      RTVI_VLM_MODEL_TO_USE: "!openai-compat"
    # aiperf sends plain OpenAI bodies; Sherlock's real calls add these. Without them the
    # run measures a different workload than production.
    extra_inputs:
      num_frames_per_second_or_fixed_frames_chunk: 1
      use_fps_for_chunking: true

  meralion:
    description: "MERaLiON-3-10B paralinguistics (emotion / stress / language)"
    serving: openai_chat
    engine: transformers              # NOT vLLM: needs trust_remote_code + custom config
    service: "data/audio/meralion_server.py"
    base_url: "http://localhost:8500"
    model: "MERaLiON/MERaLiON-3-10B"
    tokenizer: "MERaLiON/MERaLiON-3-10B"    # real HF repo (gated -> needs HF_TOKEN)
    weights_gb: 20
    health: "/v1/health/ready"
    # Deployed by Phase 4, NOT by the benchmark. bench never starts a service — it would
    # then be measuring a configuration nobody deployed.
    deployed_by: "deploy/phase4_audio.sh"
    # A request is NOT fixed work: the encoder caps at 30 s/pass, so a 99 s clip costs 4
    # passes. Normalise latency by `meralion.windows` from the response before comparing.
    work_unit: window
    # ~44 s per request, so the default 10-request warmup costs 441 s -- longer than the
    # whole measurement window, and the fast tenant finishes measuring before this one
    # starts. One warmup request is enough to fault the weights in.
    warmup_requests: 1

  rag:
    description: "RAG Blueprint end-to-end (retrieval + rerank + synthesis)"
    serving: rag_perf                 # driven by the rag-perf skill, not aiperf directly
    base_url: "http://localhost:8081"
    ingestor_url: "http://localhost:8082"
    collection: multimodal_data       # verify against /v1/collections or citations are 0
    health: "/v1/health"
    deployed_by: "deploy/phase2_rag.sh"

# ── Workloads ────────────────────────────────────────────────────────────────
# Generated by build_workloads.py from the 21-case corpus. Measured: 2,154 tokens/case
# mean, 6,354 max.
workloads:
  vlm_video:
    file: benchmark/workloads/vlm_video.jsonl
    output_tokens: 256
  rag_queries:
    file: benchmark/workloads/rag_queries.jsonl
    output_tokens: 512
  audio_statements:
    # NOT audio_manifest.json -- that is a JSON array of metadata and aiperf's single_turn
    # loader reads JSONL, so it failed with "Invalid JSON in dataset file" and MERaLiON
    # recorded n_requests=0 in every window while the run still reported success.
    file: benchmark/workloads/audio_statements.jsonl
    output_tokens: 256

# ── Sweeps ───────────────────────────────────────────────────────────────────
sweeps:
  baseline:                            # solo, one target at a time
    - {target: vlm,       workload: vlm_video,        rates: [1, 2, 4, 8]}
    - {target: meralion,  workload: audio_statements, rates: [1, 2, 4]}
    - {target: rag,       workload: rag_queries,      rates: [1, 2, 4]}

# ── Colocations ──────────────────────────────────────────────────────────────
# The real question: what co-resides on one 96 GB card before the remote NIMs come local.
#
# `solo_baselines: auto` means each tenant is first measured alone at the SAME rate, and
# the degradation ratio is coloc/solo. Baselines are keyed on rate — comparing a 4 rps
# tenant against a 1 rps baseline would invent degradation that is not there.
#
# Load is OPEN-LOOP (rps + poisson) throughout. Closed-loop concurrency throttles itself
# when the server slows, which hides exactly the degradation being measured.
colocations:

  vlm-solo:
    description: "Reference point: VLM alone. Establishes the VRAM floor."
    duration_s: 120
    isolation: none
    tenants:
      - {name: vlm, target: vlm, workload: vlm_video, load: {pattern: poisson, rps: 2}}

  vlm-meralion:
    description: "The binding question — does a ~46-62 GB VLM plus a ~20 GB MERaLiON fit in 96 GB?"
    duration_s: 180
    isolation: mps
    solo_baselines: auto
    tenants:
      - {name: vlm,      target: vlm,      workload: vlm_video,        load: {pattern: poisson, rps: 2}}
      - {name: meralion, target: meralion, workload: audio_statements, load: {pattern: poisson, rps: 1}}

  # Same pair as vlm-meralion, but at a rate MERaLiON can actually serve.
  # Measured 2026-08-31: ~22 s per request for a 51 s clip (2 encoder windows), i.e. a
  # ceiling near 0.045 rps. Offering it 1 rps (as vlm-meralion does) is ~20x capacity, so
  # that window measures "VLM beside a SATURATED neighbour" -- a real question, but not a
  # clean two-tenant envelope. This one measures the envelope; run both and compare.
  # Duration is long because the rate is low: 0.045 rps x 600 s is only ~27 requests, so
  # p99 stays flagged unreliable (<50). p50/p95 are the usable statistics here.
  vlm-meralion-sustained:
    description: "VLM + MERaLiON at MERaLiON's sustainable rate (~0.045 rps) - clean envelope"
    duration_s: 600
    isolation: mps
    solo_baselines: auto
    tenants:
      - name: vlm
        target: vlm
        workload: vlm_video
        load:
          pattern: poisson
          rps: 2
      - name: meralion
        target: meralion
        workload: audio_statements
        load:
          pattern: poisson
          rps: 0.045

  vlm-meralion-rag:
    description: "Full investigator load: video question + audio analysis + RAG retrieval."
    duration_s: 180
    isolation: mps
    solo_baselines: auto
    tenants:
      - {name: vlm,      target: vlm,      workload: vlm_video,        load: {pattern: poisson, rps: 2}}
      - {name: meralion, target: meralion, workload: audio_statements, load: {pattern: poisson, rps: 1}}
      - {name: rag,      target: rag,      workload: rag_queries,      load: {pattern: poisson, rps: 2}}

  vlm-rate-sweep:
    description: "Find the knee — where achieved rps stops tracking offered rps."
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    rps_sweep: {tenant: vlm, values: [1, 2, 4, 8, 16]}
    tenants:
      - {name: vlm,      target: vlm,      workload: vlm_video,        load: {pattern: poisson, rps: 1}}
      - {name: meralion, target: meralion, workload: audio_statements, load: {pattern: poisson, rps: 1}}

# ── Reporting thresholds ─────────────────────────────────────────────────────
# Encoded so summary.py flags them rather than leaving a human to remember.
thresholds:
  envelope_ratio: 0.95        # achieved < 0.95 x offered => past the safe envelope
  min_samples_p99: 50         # below this, p99 is labelled unreliable
  sm_active_compute_bound: 80 # %
  dram_active_memory_bound: 85
  memcpy_pct_warn: 15         # H2D+D2H share of wall time
